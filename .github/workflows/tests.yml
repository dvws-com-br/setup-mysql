name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: Unit tests and lint
    runs-on:
      - self-hosted
      - Linux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Verify bundle is up to date
        run: |
          npm run build
          git diff --exit-code dist/ || { echo "dist/ is stale, run npm run build and commit"; exit 1; }

  action:
    name: Action smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check MySQL connectivity
        run: |
          nc -zv -w 5 "$DB_HOST" "$DB_PORT"
        env:
          DB_HOST: ${{ secrets.MYSQL_HOST }}
          DB_PORT: ${{ secrets.MYSQL_PORT }}

      - name: Run the action
        id: setup-mysql
        uses: ./
        with:
          host: ${{ secrets.MYSQL_HOST }}
          port: ${{ secrets.MYSQL_PORT }}
          username: ${{ secrets.MYSQL_USER }}
          password: ${{ secrets.MYSQL_PASSWORD }}
          database-prefix: ${{ secrets.MYSQL_DATABASE_PREFIX }}
          env-name: TEST_DB

