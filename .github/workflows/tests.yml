name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: Unit tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Verify bundle is up to date
        run: |
          npm run build
          git diff --exit-code dist/ || { echo "dist/ is stale, run npm run build and commit"; exit 1; }

  action:
    name: Action smoke test
    runs-on: ubuntu-latest
    env:
      CI_PREFIX_DB: test_${{ github.run_id }}_${{ github.job }}__
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u root -proot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - name: Run the action
        id: setup-mysql
        uses: ./
        with:
          host: 127.0.0.1
          port: 3306
          username: root
          password: root
          database-prefix: test_${{ github.run_id }}_${{ github.job }}__
          env-name: TEST_DB

